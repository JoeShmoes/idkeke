<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Nexaris Module</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #000000;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            font-family: 'Segoe UI', sans-serif;
        }

        .container {
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 100%;
        }

        .logo-container {
            animation: netflix-intro 4s forwards cubic-bezier(0.645, 0.045, 0.355, 1);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .logo {
            width: 200px;
            height: 200px;
            /* Filter to ensure it looks good on black if needed, though SVG should be fine */
        }

        @keyframes netflix-intro {
            0% {
                transform: scale(0.1);
                opacity: 0;
            }
            20% {
                transform: scale(1.5);
                opacity: 1;
            }
            40% {
                transform: scale(1);
            }
            60% {
                transform: scale(1);
                opacity: 1;
            }
            90% {
                transform: scale(10);
                opacity: 0;
            }
            100% {
                transform: scale(20);
                opacity: 0;
            }
        }

        .loading-bar {
            position: absolute;
            bottom: 50px;
            width: 200px;
            height: 4px;
            background: #333;
            border-radius: 2px;
            overflow: hidden;
            opacity: 0;
            animation: fadeIn 0.5s 0.5s forwards, fadeOut 0.5s 3.5s forwards;
        }

        .loading-progress {
            width: 100%;
            height: 100%;
            background: #ffffff;
            transform: translateX(-100%);
            animation: load 3s ease-in-out forwards;
        }

        @keyframes fadeIn {
            to { opacity: 1; }
        }

        @keyframes fadeOut {
            to { opacity: 0; }
        }

        @keyframes load {
            0% { transform: translateX(-100%); }
            100% { transform: translateX(0%); }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo-container">
            <!-- Using logo.svg which will be copied from sidebar-logo-favicon.svg -->
            <img src="logo.svg" class="logo" alt="Logo">
        </div>
        <div class="loading-bar">
            <div class="loading-progress"></div>
        </div>
    </div>
</body>
</html>
