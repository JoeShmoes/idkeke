<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Nexaris Module</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            font-family: 'Segoe UI', sans-serif;
        }

        .container {
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 100%;
        }

        .logo-container {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 100%;
        }

        .logo {
            width: 60%;
            max-width: 500px;
            height: auto;
            object-fit: contain;
            opacity: 0;
            animation: elegant-entrance 3s cubic-bezier(0.22, 1, 0.36, 1) forwards;
            filter: drop-shadow(0 0 15px rgba(0, 0, 0, 0.15));
        }

        @keyframes elegant-entrance {
            0% {
                opacity: 0;
                transform: scale(0.9) translateY(20px);
                filter: drop-shadow(0 0 0 rgba(0, 0, 0, 0));
            }
            40% {
                opacity: 1;
                transform: scale(1) translateY(0);
            }
            100% {
                opacity: 1;
                transform: scale(1.05);
                filter: drop-shadow(0 0 25px rgba(0, 0, 0, 0.2));
            }
        }

        .loading-bar {
            position: absolute;
            bottom: 80px;
            width: 180px;
            height: 3px;
            background: rgba(0, 0, 0, 0.1);
            border-radius: 3px;
            overflow: hidden;
            opacity: 0;
            animation: fadeInBar 0.5s 0.5s forwards;
        }

        .loading-progress {
            width: 100%;
            height: 100%;
            background: #000000;
            transform: translateX(-100%);
            animation: load 2.5s ease-in-out 0.8s forwards;
        }

        @keyframes fadeInBar {
            to { opacity: 1; }
        }

        @keyframes load {
            0% { transform: translateX(-100%); }
            50% { transform: translateX(-30%); }
            100% { transform: translateX(0%); }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo-container">
            <img src="splash-logo.png" class="logo" alt="Nexaris Logo">
        </div>
        <div class="loading-bar">
            <div class="loading-progress"></div>
        </div>
    </div>
</body>
</html>
